<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MusicStream is offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
             gap: 12px; background: #000; color: #fff; font-family: "Times New Roman", Times, serif; text-align: center; padding: 24px; }
      h1 { margin: 0; font-size: 2rem; }
      p { margin: 0; color: #b3b3b3; max-width: 28rem; }
      button { margin-top: 12px; padding: 10px 24px; border: 0; border-radius: 999px; background: #1db954; color: #000; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>You're offline</h1>
    <p>MusicStream needs an internet connection to load your music. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </body>
</html>
